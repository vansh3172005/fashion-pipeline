# Style rules (see style_taxonomy.md, sections 5 and 7).
# Phrases are in classify.norm() form: lowercase, no punctuation, whole words.
# Additions to the taxonomy's starting lists are marked "# +".
version: 1
thresholds: {min_score: 3, relative: 0.5, max_tags: 3}
weights: {strong: 3, medium: 2, weak: 1, negative: -2, prior: 2, palette: 1, fabric: 1,
          description_cap: 3}
tie_order: [traditional, ethnic_fusion, glam, streetwear, sporty, boho, classic, minimalist]

styles:
  minimalist:
    strong: ["minimalist", "minimal", "essential", "solid", "plain", "clean"]
    medium: ["band collar", "mandarin collar", "straight fit", "relaxed fit", "overshirt", "basic",
             "everyday essential"]                                    # +
    weak: ["neutral", "everyday", "classic fit"]
    negative: ["graphic", "printed", "print", "logo", "embroidered", "sequin", "tie dye", "distressed",
               "floral", "camo", "slogan", "striped", "stripe", "stripes", "pinstriped",
               "checked", "checks", "check", "plaid", "abstract"]   # +
    palette: ["black", "white", "grey", "navy", "beige", "olive"]
    fabrics: ["cotton", "linen", "wool"]
  classic:
    strong: ["oxford", "formal", "tailored", "chinos", "chino", "dress shirt", "blazer",
             "formals", "suit", "waistcoat"]                          # +
    medium: ["polo", "striped", "checked", "check", "straight jeans", "trousers",
             "work shirt", "button down", "pleated", "office wear", "plaid"]  # +
    weak: ["smart casual", "office", "timeless", "heritage", "cotton stretch", "slim fit",
           "regular fit"]
    negative: ["oversized", "graphic", "baggy", "cropped", "distressed", "neon", "kurta"]
    palette: ["white", "navy", "blue", "grey", "brown", "beige"]
    fabrics: ["cotton", "wool"]
  streetwear:
    strong: ["streetwear", "oversized", "graphic", "baggy", "drop shoulder", "cargo", "varsity",
             "street wear", "acid wash", "puff print", "boxy fit"]    # +
    medium: ["hoodie", "puffer", "distressed", "washed", "patchwork", "anime", "utility", "boxy",
             "wide leg", "co ord", "parachute", "bomber", "typography", "marvel", "skater"]  # +
    weak: ["urban", "street", "logo", "print", "printed", "slogan", "tee", "denim jacket"]
    negative: ["formal", "tailored", "kurta", "sherwani", "formals", "linen"]
    palette: []
    fabrics: ["fleece", "denim"]
  boho:
    strong: ["boho", "bohemian", "kaftan", "tie dye", "block print", "ikat", "crochet", "macrame",
             "fringe", "tassel", "block printed", "hand block printed", "batik", "shibori", "kantha",
             "hand embroidered", "watercolour"]  # +
    medium: ["paisley", "floral", "tribal", "hand painted", "hand block", "camp collar printed",
             "printed linen", "artisanal", "shacket", "dabu", "kalamkari print", "tropical",
             "hawaiian", "resort shirt"]                              # +
    weak: ["earthy", "relaxed", "resort", "printed", "linen", "handcrafted"]
    negative: ["formal", "tailored", "sport", "gym", "sequin", "graphic", "anime"]
    palette: ["orange", "yellow", "brown", "green"]
    fabrics: ["linen", "cotton"]
  sporty:
    strong: ["activewear", "athleisure", "gym", "training", "running", "dry fit", "quick dry",
             "moisture wicking", "performance", "track pants", "joggers", "jogger", "dri fit",
             "trackpants", "workout", "tracksuit", "track jacket", "compression"]                    # +
    medium: ["track jacket", "compression", "sports", "workout", "athletic", "jersey",
             "tracksuit", "gym vest", "tank top", "shorts", "sweat wicking", "rapid dry",
             "4 way stretch", "football", "cricket"]                  # +
    weak: ["active", "sweat", "lounge", "sweatpants", "breathable", "mesh", "stretch"]
    negative: ["formal", "sherwani", "kurta", "embroidered", "linen", "formals", "jeans", "denim",
               "baggy"]
    palette: []
    fabrics: ["polyester", "nylon", "elastane"]
  glam:
    strong: ["embellished", "sequin", "sequinned", "zari", "velvet", "brocade", "party wear",
             "wedding", "reception", "groom", "tuxedo", "sherwani", "mirror work", "zardozi",
             "partywear", "sangeet"]                                  # +
    medium: ["embroidered", "satin", "jacquard", "metallic", "bandhgala", "festive", "occasion",
             "statement", "luxe", "silk", "embroidery", "shimmer", "lurex", "foil"]  # +
    weak: ["gold", "royal", "rich", "celebration", "party"]
    negative: ["gym", "training", "plain tee", "basic", "joggers"]
    palette: ["black", "red", "purple"]
    fabrics: ["silk", "velvet", "satin"]
  ethnic_fusion:
    strong: ["indo western", "indowestern", "fusion", "kurta jacket", "jacket set", "dhoti pants",
             "asymmetric kurta", "indo western set", "jodhpuri", "short kurta"]  # +
