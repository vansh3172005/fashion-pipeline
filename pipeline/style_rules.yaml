             "shacket kurta", "ethnic print bomber", "bandhgala", "modi jacket", "bundi",
             "kurta with jeans", "ethnic jacket"]                     # +
    weak: ["modern ethnic", "contemporary kurta", "bandi", "contemporary"]
    negative: ["gym", "training"]
    palette: []
    fabrics: []
  traditional:
    strong: ["kurta", "kurta set", "pyjama", "pathani", "sherwani", "dhoti", "mundu", "veshti",
             "lungi", "angrakha", "kurta pyjama", "churidar", "kurtas"]  # +
    medium: ["bandi", "nehru jacket", "chikankari", "bandhani", "ajrakh", "kalamkari", "banarasi",
             "khadi", "handloom", "lucknowi", "phulkari", "churidar", "bandhgala", "ethnic wear",
             "ethnicwear", "dhoti kurta", "salwar"]                    # +
    weak: ["ethnic", "festive", "puja", "diwali", "eid", "handwoven", "craft", "traditional"]
    negative: ["graphic", "oversized", "gym", "baggy"]
    palette: []
    fabrics: ["khadi", "cotton", "silk"]

# Descriptions often suggest what to pair an item with ("style it with chinos"),
# so garment nouns and dress-code words only count in the title, type, tags and
# labelled fields.
description_ignore: ["trousers", "chinos", "chino", "blazer", "suit", "polo", "joggers", "jogger",
  "shorts", "kurta", "kurtas", "kurta set", "kurta pyjama", "pyjama", "hoodie", "tee", "jeans",
  "sherwani", "track pants", "trackpants", "tracksuit", "nehru jacket", "jacket set", "waistcoat",
  "dhoti", "churidar", "bandhgala", "bandi", "dress shirt", "formal", "formals", "tailored",
  "office", "office wear", "work shirt", "denim jacket", "co ord", "kurta jacket", "overshirt",
  "shacket", "bomber", "puffer", "cargo", "varsity", "tank top", "gym vest", "streetwear",
  "street wear", "street", "urban", "party", "wedding", "reception", "occasion", "festive"]
# A style needs at least one strong or medium keyword (a brand prior alone is not enough);
# palette, fabric and weak words alone cannot lift it above this score.
no_evidence_cap: 2

# Signature cues used by the conflict rules (section 3)
cues:
  embellishment: ["embellished", "embroidered", "embroidery", "sequin", "sequinned", "zari",
                  "zardozi", "mirror work", "brocade", "velvet", "beaded", "stone work",
                  "thread work", "metallic", "foil"]
  fusion: ["indo western", "indowestern", "fusion"]
  western_garment: ["jeans", "denim", "jacket", "bomber", "shirt collar", "blazer", "shacket"]
  print: ["print", "printed", "prints", "graphic", "pattern", "patterned", "floral", "paisley",
          "tie dye", "camo", "slogan", "logo", "typography", "abstract", "geometric"]
  sport: ["gym", "training", "running", "activewear", "athleisure", "dry fit", "dri fit",
          "performance", "sports", "workout", "quick dry"]
  street_bottom: ["oversized", "baggy", "cargo", "cargos", "graphic", "wide leg", "parachute"]
  boho_signature: ["kantha", "tie dye", "kaftan", "block print", "block printed", "hand block", "ikat",
                   "batik", "shibori", "crochet", "fringe", "tassel", "boho", "bohemian"]

neutral_colors: [black, white, grey, navy, beige]

