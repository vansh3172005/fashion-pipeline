# Women's style rules (style_taxonomy_women.md, sections 5 and 7).
# Phrases are in classify.norm() form: lowercase, no punctuation, whole words.
# Additions to the taxonomy's starting lists are marked "# +".
# The men's rules stay in style_rules.yaml; style.py loads one file per catalogue.
version: 1
style_ids: [minimalist, classic, streetwear, boho, sporty, glam, ethnic_fusion, traditional, edgy]
thresholds: {min_score: 3, relative: 0.5, max_tags: 3}
weights: {strong: 3, medium: 2, weak: 1, negative: -2, prior: 2, palette: 1, fabric: 1,
          description_cap: 3}
tie_order: [traditional, ethnic_fusion, glam, edgy, streetwear, sporty, boho, classic, minimalist]

styles:
  minimalist:
    strong: ["minimalist", "minimal", "essential", "solid", "plain", "clean", "capsule",
             "essentials", "basic tee", "everyday essential"]               # +
    medium: ["slip dress", "straight fit", "wide leg trousers", "co ord", "knit top", "basic",
             "relaxed fit", "monochrome", "ribbed", "rib knit", "tank top", "solid colour"]  # +
    weak: ["neutral", "everyday", "effortless", "versatile"]
    negative: ["graphic", "printed", "print", "embellished", "sequin", "embroidered", "ruffle",
               "tie dye", "floral", "zari", "embroidery", "sequinned", "mirror work",
               "bandhani", "block print", "checked", "striped", "polka", "leopard",
               "ruffled", "frill", "lace"]                                    # +
