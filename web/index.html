<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Catalogue</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f6f6f4; --surface:#fcfcfb; --raised:#ffffff; --ink:#0b0b0b; --ink-2:#52514e; --muted:#7a7974;
    --line:#e3e2dd; --line-2:#efeee9; --accent:#2a78d6; --accent-ink:#ffffff; --track:#efeee9;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --none:#c9c8c2;
    --tile:#eef0f4; --paper:#f7f6f2;
    --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#3a3936; --c0:#a3a29b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:#121211; --surface:#1a1a19; --raised:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8e86;
      --line:#34332f; --line-2:#2a2a27; --accent:#3987e5; --accent-ink:#ffffff; --track:#2a2a27;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --none:#4a4945;
      --tile:#2a2c30; --paper:#ecebe6;
      --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#d9d8d2; --c0:#6d6c66;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --raised:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8e86;
    --line:#34332f; --line-2:#2a2a27; --accent:#3987e5; --accent-ink:#ffffff; --track:#2a2a27;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --none:#4a4945;
    --tile:#2a2c30; --paper:#ecebe6;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#d9d8d2; --c0:#6d6c66;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  button { font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
  .bar1 { display:flex; gap:14px; align-items:center; padding:10px 20px; flex-wrap:wrap; }
  .bar1 h1 { font-size:16px; margin:0; font-weight:650; white-space:nowrap; }
  .tabs { display:flex; gap:2px; background:var(--line-2); padding:3px; border-radius:8px; }
  .tabs button, .seg button { border:0; background:transparent; padding:5px 12px; border-radius:6px; cursor:pointer; color:var(--ink-2); }
  .tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background:var(--raised); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600; }
  #q { flex:1; min-width:160px; max-width:360px; padding:7px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:var(--raised); color:var(--ink); }
  #count { color:var(--ink-2); margin-left:auto; white-space:nowrap; }
  #theme { border:1px solid var(--line); background:var(--raised); border-radius:6px; padding:5px 9px; cursor:pointer; }
  .bar2 { display:flex; gap:16px; align-items:center; padding:0 20px 10px; flex-wrap:wrap; }
  .catsw { display:flex; gap:2px; background:var(--ink); padding:3px; border-radius:9px; }
  .catsw button { border:0; background:transparent; color:var(--bg); padding:5px 14px; border-radius:7px; cursor:pointer; font-weight:600; }
  .catsw button[aria-pressed="true"] { background:var(--bg); color:var(--ink); }
  .catsw small { font-weight:400; opacity:.7; margin-left:4px; }
  .dds { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:8px 10px; flex:1 1 100%; }
  .dds label { display:flex; flex-direction:column; gap:2px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .dds select { font:inherit; font-size:13px; letter-spacing:0; text-transform:none; color:var(--ink); padding:5px 6px;
    border:1px solid var(--line); border-radius:6px; background:var(--raised); min-width:0; }
  .dds select.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .seg { display:flex; flex-wrap:wrap; gap:2px; background:var(--line-2); padding:3px; border-radius:8px; max-width:100%; }
  .lbl { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-right:-8px; }
  .active { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .pill { display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line); background:var(--raised); border-radius:999px; padding:2px 6px 2px 10px; font-size:12px; cursor:pointer; }
  .pill b { font-weight:600; }
  .pill span[aria-hidden] { color:var(--muted); font-size:14px; line-height:1; }
  .linkbtn { border:0; background:none; color:var(--accent); cursor:pointer; padding:2px 4px; font-size:12px; }

  .layout { display:flex; align-items:flex-start; }
  aside { width:250px; flex:none; padding:14px 18px 40px; border-right:1px solid var(--line); height:calc(100vh - 98px); overflow:auto; position:sticky; top:98px; background:var(--surface); }
  aside h3 { margin:16px 0 6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  aside h3:first-child { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { border:1px solid var(--line); background:var(--raised); border-radius:999px; padding:2px 9px; font-size:12px; cursor:pointer; }
  .chip small { color:var(--muted); margin-left:3px; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip[aria-pressed="true"] small { color:var(--accent-ink); opacity:.8; }
  .sw { width:22px; height:22px; border-radius:50%; border:1px solid rgba(0,0,0,.18); cursor:pointer; padding:0; }
  .sw[aria-pressed="true"] { outline:2px solid var(--accent); outline-offset:2px; }
  .swrap { display:flex; flex-wrap:wrap; gap:8px; }
  main { flex:1; padding:16px 20px 40px; min-width:0; }
  .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; color:var(--ink-2); }
  .toolbar select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--raised); color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .ghead { grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; padding:8px 10px;
    border:0; border-left:3px solid var(--accent); background:var(--surface); border-radius:6px; cursor:pointer; text-align:left; font-size:13px; }
  .ghead:first-child { margin-top:0; }
  .ghead:hover, .ghead:focus-visible { background:var(--line-2); }
  .ghead .gc { font-weight:650; text-transform:capitalize; }
  .ghead span { text-transform:capitalize; }
  .ghead i { color:var(--muted); font-style:normal; }
  .ghead small { margin-left:auto; color:var(--ink-2); }
  #outfits { padding:16px 20px 48px; }
  .obar { flex-wrap:wrap; }
  .obar select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--raised); color:var(--ink); }
  .obtn { border:1px solid var(--line); background:var(--raised); border-radius:6px; padding:5px 12px; cursor:pointer; }
  .onote { font-size:12px; color:var(--muted); margin:0 0 12px; }
  .ogrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; }
  .ocard { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px 12px; }
  .ocard .ohead { display:flex; gap:8px; align-items:baseline; margin-bottom:8px; font-size:12px; color:var(--ink-2); }
  .ocard .ohead b { color:var(--ink); font-size:13px; white-space:nowrap; }
  .ocard .ohead .osc { margin-left:auto; white-space:nowrap; }
  .opieces { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; }
  .opiece { border:1px solid var(--line); background:var(--raised); border-radius:8px; padding:0 0 4px; cursor:pointer; text-align:left; overflow:hidden; }
  .opiece:hover, .opiece:focus-visible { box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .opiece .oi { aspect-ratio:600/340; background:var(--paper); }
  .opiece .oi.ph { aspect-ratio:3/4; background:var(--tile); }
  .opiece img { width:100%; height:100%; object-fit:contain; display:block; }
  .opiece .oi.ph img { object-fit:cover; }
  .opiece span { display:block; font-size:11px; padding:3px 6px 0; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .opiece span b { color:var(--ink); font-weight:600; text-transform:capitalize; }
  .look { margin-top:16px; }
  .look h3 { font-size:13px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .look h3 button { margin-left:auto; font-size:12px; }
  .look .ocard { margin-bottom:10px; }
  @media (max-width:820px) { #outfits { padding-left:16px; padding-right:16px; } .ogrid { grid-template-columns:1fr; } }
  .card { background:var(--raised); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; text-align:left; padding:0; }
  .card:hover, .card:focus-visible { box-shadow:0 2px 12px rgba(0,0,0,.10); }
  .img { aspect-ratio:3/4; background:var(--tile); position:relative; }
  .img img { width:100%; height:100%; object-fit:cover; display:block; }
  .img img.flat { object-fit:contain; padding:8px; }
  .img.sk { aspect-ratio:600/340; background:var(--paper); }
  .img.sk img { object-fit:contain; padding:6px 4px; }
  .stag { position:absolute; left:6px; top:6px; font-size:11px; font-weight:600; border-radius:999px; padding:1px 8px 1px 6px; background:var(--raised); color:var(--ink); display:inline-flex; align-items:center; gap:5px; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .stag i, .sdot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .sketchbox { background:var(--paper); border-radius:10px; margin:12px 0; padding:6px; }
  .sketchbox img { width:100%; display:block; }
  .sketchbox .cap { display:flex; justify-content:space-around; font-size:11px; color:#6b6a64; padding:2px 0 4px; }
  .scores { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .scores span { font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 5px; color:var(--ink-2); }
  .img .badge { position:absolute; left:6px; top:6px; font-size:10px; background:var(--raised); border-radius:4px; padding:1px 5px; color:var(--ink-2); }
  .meta { padding:9px 10px 10px; display:flex; flex-direction:column; gap:3px; }
  .t { font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.9em; }
  .s { color:var(--ink-2); font-size:12px; }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
  .tag { font-size:11px; background:var(--line-2); border-radius:4px; padding:1px 6px; color:var(--ink-2); }
  #more { display:block; margin:22px auto 0; padding:8px 22px; border:1px solid var(--line); background:var(--raised); border-radius:6px; cursor:pointer; }
  .empty { padding:60px; text-align:center; color:var(--ink-2); }
  .hidden { display:none !important; }

  /* analytics */
  #analytics { padding:16px 20px 48px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .kpi .k { font-size:12px; color:var(--ink-2); }
  .kpi .v { font-size:24px; font-weight:650; margin-top:2px; font-variant-numeric:tabular-nums; }
  .kpi .sub { font-size:12px; color:var(--muted); }
  .charts { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px 14px; min-width:0; }
  .panel.wide { grid-column:1/-1; }
  .panel h2 { font-size:13px; margin:0 0 2px; font-weight:600; }
  .phead { display:flex; align-items:center; gap:8px; }
  #analytics .charts { grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
  .asum { font-size:14px; color:var(--ink-2); padding:4px 2px 12px; }
  .asum b { color:var(--ink); }
  .ptable { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  .ptable h2 { font-size:14px; margin:0 0 2px; font-weight:650; }
  .ptable .pnote { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .ptable table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  .ptable th { text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
    font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); }
  .ptable td { padding:6px; border-bottom:1px solid var(--line-2); text-transform:capitalize; }
  .ptable .pc, .ptable .n { text-align:right; white-space:nowrap; }
  .ptable td.pc { font-weight:650; color:var(--ink); }
  .ptable td.n { color:var(--muted); }
  .ptable tbody tr { cursor:pointer; }
  .ptable tbody tr:hover { background:var(--line-2); }
  .ptable tbody tr.on { background:var(--line-2); box-shadow:inset 3px 0 0 var(--accent); }
  .ptable .dot { display:inline-block; width:10px; height:10px; border-radius:50%; border:1px solid rgba(0,0,0,.2); margin-right:7px; vertical-align:-1px; }
  .phead select { margin-left:auto; font:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--raised); color:var(--ink); }
  .row[disabled] { cursor:default; }
  .panel .note { font-size:12px; color:var(--muted); margin:0 0 10px; }
  .rows { display:flex; flex-direction:column; gap:2px; }
  .row { display:grid; grid-template-columns:minmax(80px,34%) 1fr 64px; gap:8px; align-items:center; border:0; background:transparent; padding:3px 4px; border-radius:6px; cursor:pointer; text-align:left; }
  .row:hover, .row:focus-visible { background:var(--line-2); }
  .row .name { font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .row .dot { width:10px; height:10px; border-radius:50%; border:1px solid rgba(0,0,0,.2); flex:none; }
  .row .track { height:14px; position:relative; }
  .row .fill { position:absolute; left:0; top:0; bottom:0; background:var(--s1); border-radius:0 4px 4px 0; min-width:2px; }
  .row .val { font-size:12px; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums; }
  .rows.has-sel .row:not([aria-pressed="true"]) .fill { opacity:.35; }
  .row[aria-pressed="true"] .name { font-weight:650; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin:0 0 8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .stack { display:flex; height:14px; gap:2px; }
  .stack span { display:block; height:100%; }
  .stack span:last-child { border-radius:0 4px 4px 0; }
  .srow { display:grid; grid-template-columns:110px 1fr 46px; gap:8px; align-items:center; padding:3px 4px; font-size:12px; }
  .srow .val { color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums; }
  svg text { fill:var(--ink-2); font-size:11px; }
  svg .grid { stroke:var(--line); }
  svg .bin { cursor:pointer; }
  svg .bin:hover rect.mark { filter:brightness(1.12); }
  .tip { position:fixed; pointer-events:none; z-index:50; background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.15); max-width:260px; }
  .tip strong { font-size:13px; }
  details.table { margin-top:8px; font-size:12px; color:var(--ink-2); }
  details.table table { border-collapse:collapse; width:100%; margin-top:6px; }
  details.table td, details.table th { border-bottom:1px solid var(--line-2); padding:3px 6px; text-align:left; }
  details.table td:last-child, details.table th:last-child { text-align:right; }

  /* drawer */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; }
  .drawer { position:fixed; right:0; top:0; bottom:0; width:min(560px,100%); background:var(--surface); z-index:41; overflow:auto; padding:18px 20px 30px; box-shadow:-4px 0 20px rgba(0,0,0,.2); }
  .drawer h2 { margin:0 30px 4px 0; font-size:17px; }
  .drawer .close { position:absolute; right:14px; top:12px; border:0; background:none; font-size:22px; cursor:pointer; color:var(--ink-2); }
  .views { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin:12px 0; }
  .views figure { margin:0; background:var(--tile); border-radius:8px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative; }
  .views img { max-width:100%; max-height:100%; }
  .views figcaption { position:absolute; bottom:4px; left:6px; font-size:10px; color:var(--ink-2); }
  .attrs { width:100%; border-collapse:collapse; font-size:13px; }
  .attrs td { padding:5px 4px; border-bottom:1px solid var(--line-2); vertical-align:top; }
  .attrs td:first-child { color:var(--ink-2); width:38%; }
  .src { font-size:10px; border-radius:4px; padding:0 5px; margin-left:6px; color:var(--ink-2); border:1px solid var(--line); white-space:nowrap; }
  .src.site { border-color:var(--s1); color:var(--s1); }
  .drawer a.ext { color:var(--accent); }
  .srow > * { min-width:0; }
  details.table { overflow-x:auto; }
  @media (max-width:820px) { aside { display:none; } .bar1, .bar2 { padding-left:16px; padding-right:16px; } .lbl { width:100%; margin:0; } main, #analytics { padding-left:16px; padding-right:16px; } .row { grid-template-columns:minmax(70px,38%) 1fr 48px; } .bar1 #q { order:5; max-width:none; } .charts { grid-template-columns:1fr; } #count { margin-left:0; } }
</style>
</head>
<body>
<header>
  <div class="bar1">
    <div class="catsw" id="catsw" role="group" aria-label="Catalogue">
      <button data-cat="men" aria-pressed="true">Men</button>
      <button data-cat="women" aria-pressed="false">Women</button>
    </div>
    <h1 id="title">Men's Style Catalogue</h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-catalogue" aria-selected="true">Catalogue</button>
      <button role="tab" id="tab-analytics" aria-selected="false">Analytics</button>
      <button role="tab" id="tab-outfits" aria-selected="false">Outfits</button>
    </div>
    <input id="q" type="search" placeholder="Search title, site or style…" aria-label="Search">
    <span id="count"></span>
    <button id="theme" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
  </div>
  <div class="bar2">
    <div class="dds" id="dds"></div>
    <div class="active" id="active"></div>
  </div>
</header>

<div class="layout" id="view-catalogue">
  <aside id="filters"></aside>
  <main>
    <div class="toolbar">
      <label>Sort <select id="sort">
        <option value="">Default</option><option value="price-asc">Price: low → high</option>
        <option value="price-desc">Price: high → low</option><option value="discount">Biggest discount</option>
      </select></label>
      <label>Group similar <select id="groupby">
        <option value="color">Colour › print</option><option value="pattern">Print › colour</option>
        <option value="fit">Fit › colour</option><option value="fabric">Fabric › colour</option>
        <option value="sleeve_length">Sleeve › colour</option><option value="neckline">Neckline › colour</option>
        <option value="wear">Sub-type › colour</option><option value="">No grouping</option>
      </select></label>
      <label><input type="checkbox" id="show-flat" checked> Show flat sketches (uncheck for site photos)</label>
    </div>
    <div class="grid" id="grid"></div>
    <button id="more" hidden>Load more</button>
  </main>
</div>

<section id="analytics" class="hidden" aria-label="Analytics dashboard">
  <div class="kpis" id="kpis"></div>
  <div class="charts" id="charts"></div>
</section>

<section id="outfits" class="hidden" aria-label="Outfit recommender">
  <div class="toolbar obar">
    <label>Outfit <select id="o-kind"><option value="">Any</option><option value="western">Western</option>
      <option value="indian">Indian</option><option value="onepiece">Dress / jumpsuit</option><option value="coord">Co-ord</option></select></label>
    <label>Style <select id="o-style"></select></label>
    <label>Occasion <select id="o-occasion"><option value="">Any</option><option value="casual">Casual</option>
      <option value="formal">Formal / office</option><option value="party">Party</option><option value="festive">Festive / wedding</option>
      <option value="active">Active / gym</option></select></label>
    <label>Budget <select id="o-band"><option value="">Any</option><option value="cheap">Cheap</option>
      <option value="affordable">Affordable</option><option value="luxury">Luxury</option></select></label>
    <label>Size <select id="o-size"><option value="">Any</option><option>XS</option><option>S</option><option>M</option>
      <option>L</option><option>XL</option><option>XXL</option></select></label>
    <button id="o-more" class="obtn" title="Same outfits found in a different order">Shuffle ↻</button>
  </div>
  <p class="onote">Outfits follow <b>outfit_styling_rules.md</b>: same occasion, compatible styles, size in stock;
    scored on colour, pattern, fit, fabric and price. Click any piece to open it.</p>
  <div class="ogrid" id="ogrid"></div>
</section>

<div class="tip hidden" id="tip" role="tooltip"></div>
<div id="drawer-root"></div>

<script src="recommend.js"></script>
<script>
"use strict";
const PAGE = 48;
const SWATCH = {black:"#111",white:"#fff",grey:"#9a9a9a",navy:"#1f2a4a",blue:"#3b6fb6",red:"#b3261e",green:"#4f7a4a",
  beige:"#d8c8a8",brown:"#6b4a33",yellow:"#e6c229",orange:"#e07a2b",pink:"#e8a0b8",purple:"#7a4fa0",
  multi:"linear-gradient(135deg,#e33 0 25%,#fc3 25% 50%,#3a6 50% 75%,#38c 75%)"};
const BAND_ORDER = ["cheap","affordable","luxury"];
// the taxonomy's styles in order (men: eight; women: nine, adding edgy);
// colour follows the style, never its rank, and is the same in both catalogues
const DEPTS = ["topwear","bottomwear","fullbody","footwear","accessories"];
const BASE_STYLES = ["minimalist","classic","streetwear","boho","sporty","glam","ethnic_fusion","traditional"];
const STYLES_BY = {men: [...BASE_STYLES, "unclassified"], women: [...BASE_STYLES, "edgy", "unclassified"]};
const STYLE_COLOR = Object.fromEntries([...BASE_STYLES.map((s, i) => [s, `var(--c${i + 1})`]),
  ["edgy", "var(--c9)"], ["unclassified", "var(--c0)"]]);
const CATALOGUES = {men: {file: "catalogue.json", title: "Men's Style Catalogue"},
                    women: {file: "catalogue_women.json", title: "Women's Style Catalogue"}};
let STYLES = STYLES_BY.men, catalogue = "men";
const DATA = {};
const SIZE_ORDER = ["XXS","XS","S","M","L","XL","XXL","2XL","3XL","XXXL","4XL","5XL","6XL"];
// facet key -> [label, item field, multi-valued?]
const FACETS = {
  style:["Style","primary_style"], style_tag:["Also tagged","style_tags",true], site:["Site","site"],
  confidence:["Style confidence","style_confidence"], department:["Department","department"],
  category:["Category","category"], gender:["Gender","gender"], price_band:["Price band","price_band"],
  color:["Colour","color"], secondary_color:["Secondary colour","secondary_color"],
  pattern:["Pattern","pattern"], fit:["Fit","fit"], fabric:["Fabric","fabric"],
  sleeve_length:["Sleeve length","sleeve_length"], neckline:["Neckline","neckline"],
  occasion:["Occasion","occasion"], size:["Size in stock","sizes_available",true],
};
const SIDEBAR = ["department","style","style_tag","site","category","pattern","fit","fabric","sleeve_length","neckline","occasion","size","confidence"];
const PARAMS = ["color","secondary_color","pattern","fit","fabric","sleeve_length","neckline","occasion","size"];
const SRC_GROUPS = [ // stacked "where did the value come from" chart, fixed slot order
  ["Site field", ["field"], "var(--s1)"], ["Site tags / title", ["tags","title"], "var(--s2)"],
  ["Description", ["description"], "var(--s3)"], ["Image pixels", ["image"], "var(--s4)"],
  ["Category default", ["default"], "var(--s5)"], ["Not set / n.a.", ["n/a", null, undefined], "var(--none)"],
];
const SRC_TEXT = {field:"site field", tags:"site tags", title:"title", description:"description",
  image:"image", default:"default", "n/a":"n/a"};

const sel = Object.fromEntries(Object.keys(FACETS).map(k => [k, new Set()]));
let items = [], shown = PAGE, query = "", tab = "catalogue", sortBy = "", showFlat = true;

// ---------------------------------------------------------------- helpers
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https?:\/\/|flat\/|sketch(_women)?\/[\w\/.-]+\.svg$)/i.test(String(u || "")) ? esc(u) : "#";
const label = v => v == null || v === "" ? "unspecified" : String(v).replace(/_/g, " ");
const vals = (it, key) => { const [, f, multi] = FACETS[key]; const v = it[f];
  if (multi) return v || [];
  if (v == null) return [(it.attr_source || {})[key] === "n/a" ? "n/a" : "unspecified"];
  return [v]; };
const cur = () => "INR";  // every site in sites.json sells in INR
function money(n, c) {
  if (n == null) return "–";
  try { return new Intl.NumberFormat("en-IN", c ? {style:"currency", currency:c, maximumFractionDigits:0}
                                               : {maximumFractionDigits:0}).format(n); }
  catch { return Math.round(n).toLocaleString(); }
}
const median = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };

function matches(it, skip) {
  for (const key in sel) {
    if (key === skip || !sel[key].size) continue;
    if (!vals(it, key).some(v => sel[key].has(String(v)))) return false;
  }
  if (query) {
    const hay = (it.title + " " + it.site + " " + (it.vendor || "") + " " + (it.primary_style || "").replace("_", " ")).toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}
function countBy(list, key) {
  const c = new Map();
  for (const it of list) for (const v of vals(it, key)) c.set(String(v), (c.get(String(v)) || 0) + 1);
  return c;
}
function ordered(key, counts) {
  const keys = [...counts.keys()];
  if (key === "price_band") return BAND_ORDER.filter(b => counts.has(b)).concat(keys.filter(k => !BAND_ORDER.includes(k)));
  if (key === "style" || key === "style_tag") return STYLES.filter(s => counts.has(s));
  if (key === "department") return DEPTS.filter(s => counts.has(s));
  if (key === "confidence") return ["high","medium","low"].filter(s => counts.has(s));
  if (key === "size") return keys.sort((a,b) => (SIZE_ORDER.indexOf(a)+1 || 99) - (SIZE_ORDER.indexOf(b)+1 || 99) || a.localeCompare(b, undefined, {numeric:true}));
  const last = k => k === "n/a" ? 2 : k === "unspecified" ? 1 : 0;   // keep gaps at the bottom
  return keys.sort((a,b) => last(a) - last(b) || counts.get(b) - counts.get(a));
}
function toggle(key, v) {
  const s = sel[key]; s.has(v) ? s.delete(v) : s.add(v);
  shown = PAGE; render();
}
function setOnly(key, v) { sel[key].clear(); if (v) sel[key].add(v); shown = PAGE; render(); }

// ---------------------------------------------------------------- header controls
const DD = [["department", "Department"], ["style", "Style"], ["category", "Category"], ["site", "Site"],
            ["price_band", "Price band"], ["color", "Colour"], ["occasion", "Occasion"], ["gender", "Gender"]];
const fmtPct = x => (x > 0 && x < 10 ? x.toFixed(1) : Math.round(x)) + "%";
function renderDropdowns() {
  // one dropdown per filter; every option shows its share of the items the OTHER filters leave
  document.getElementById("dds").innerHTML = DD.map(([key, name]) => {
    const base = items.filter(it => matches(it, key)), total = base.length || 1;
    const counts = countBy(base, key);
    const opts = ordered(key, counts).map(v =>
      `<option value="${esc(v)}"${sel[key].size === 1 && sel[key].has(v) ? " selected" : ""}>${esc(label(v))} · ${fmtPct(100 * counts.get(v) / total)}</option>`);
    const many = sel[key].size > 1 ? `<option value="__many" selected>${sel[key].size} selected</option>` : "";
    return `<label>${esc(name)}<select data-filter="${key}" class="${sel[key].size ? "on" : ""}">
      <option value=""${sel[key].size ? "" : " selected"}>All · ${base.length.toLocaleString()}</option>${many}${opts.join("")}</select></label>`;
  }).join("");
}
function renderActive() {
  const root = document.getElementById("active");
  const pills = [];
  for (const key in sel) for (const v of sel[key])
    pills.push(`<button class="pill" data-k="${key}" data-v="${esc(v)}" title="Remove filter">${esc(FACETS[key][0])}: <b>${esc(label(v))}</b><span aria-hidden="true">×</span></button>`);
  if (query) pills.push(`<span class="pill">Search: <b>${esc(query)}</b></span>`);
  root.innerHTML = pills.join("") + (pills.length ? `<button class="linkbtn" id="clear">Clear all</button>` : "");
}

// ---------------------------------------------------------------- catalogue
function renderFilters() {
  let h = "";
  for (const key of SIDEBAR) {
    const counts = countBy(items.filter(it => matches(it, key)), key);
    for (const v of sel[key]) if (!counts.has(v)) counts.set(v, 0);
    h += `<h3>${esc(FACETS[key][0])}</h3><div class="chips">` + ordered(key, counts).map(n =>
      `<button class="chip" data-k="${key}" data-v="${esc(n)}" aria-pressed="${sel[key].has(n)}">${esc(label(n))}<small>${counts.get(n)}</small></button>`).join("") + `</div>`;
  }
  for (const key of ["color", "secondary_color"]) {
    const cc = countBy(items.filter(it => matches(it, key)), key);
    h += `<h3>${esc(FACETS[key][0])}</h3><div class="swrap">` + Object.keys(SWATCH).filter(c => cc.get(c) || sel[key].has(c)).map(c =>
      `<button class="sw" data-k="${key}" data-v="${c}" aria-pressed="${sel[key].has(c)}" title="${c} (${cc.get(c) || 0})" aria-label="${c}, ${cc.get(c) || 0} items" style="background:${SWATCH[c]}"></button>`).join("") + `</div>`;
  }
  document.getElementById("filters").innerHTML = h;
}
function sorted(list) {
  const by = {"price-asc": (a,b) => (a.price ?? 1e12) - (b.price ?? 1e12), "price-desc": (a,b) => (b.price ?? -1) - (a.price ?? -1),
              "discount": (a,b) => (b.discount_pct || 0) - (a.discount_pct || 0)}[sortBy];
  return by ? [...list].sort(by) : list;
}
// ---- "group similar": category › chosen attribute › second attribute, and inside a
// group the remaining attributes, so near-identical pieces sit side by side
const SIM_FIELDS = ["color", "pattern", "fit", "fabric", "sleeve_length", "neckline", "wear"];
const simVal = (it, f) => f === "wear" ? ((it.wear_types || [])[0] || "plain") : (it[f] ?? "");
function simOrder(g) {
  if (!g) return null;
  const second = g === "color" ? "pattern" : "color";
  return [g, second, ...SIM_FIELDS.filter(f => f !== g && f !== second)];
}
function groupKey(it, g) { const o = simOrder(g); return [it.category, simVal(it, o[0]), simVal(it, o[1])]; }
function groupSorted(list, g) {
  const order = simOrder(g), by = {"price-asc": (a,b) => (a.price ?? 1e12) - (b.price ?? 1e12), "price-desc": (a,b) => (b.price ?? -1) - (a.price ?? -1),
              "discount": (a,b) => (b.discount_pct || 0) - (a.discount_pct || 0)}[sortBy];
  const size = new Map(), catN = new Map(), keyOf = new Map();
  for (const it of list) {
    const k = groupKey(it, g).join("|"); keyOf.set(it, k);
    size.set(k, (size.get(k) || 0) + 1); catN.set(it.category, (catN.get(it.category) || 0) + 1);
  }
  const cmp = (a, b) => String(a).localeCompare(String(b));
  return [[...list].sort((a, b) =>
    (catN.get(b.category) - catN.get(a.category)) || cmp(a.category, b.category) ||           // big categories first
    (size.get(keyOf.get(b)) - size.get(keyOf.get(a))) || cmp(keyOf.get(a), keyOf.get(b)) ||   // big groups first
    (by ? by(a, b) : 0) ||
    order.slice(2).reduce((r, f) => r || cmp(simVal(a, f), simVal(b, f)), 0) || cmp(a.title, b.title)), size, keyOf];
}
let groupBy = "color";
const GROUP_FACET = {color: "color", pattern: "pattern", fit: "fit", fabric: "fabric", sleeve_length: "sleeve_length", neckline: "neckline"};
function groupHead(it, n) {
  const o = simOrder(groupBy), parts = [it.category, simVal(it, o[0]), simVal(it, o[1])];
  const facets = [["category", it.category], [GROUP_FACET[o[0]], simVal(it, o[0])], [GROUP_FACET[o[1]], simVal(it, o[1])]]
    .filter(([k, v]) => k && v !== "");
  return `<button class="ghead" data-group='${esc(JSON.stringify(facets))}' title="Show only this group">
    ${parts.map((p, i) => `<span${i ? "" : ' class="gc"'}>${esc(label(p === "" ? null : p))}</span>`).join("<i>›</i>")}
    <small>${n.toLocaleString()} item${n === 1 ? "" : "s"}</small></button>`;
}

function renderGrid(list) {
  const grid = document.getElementById("grid");
  if (!list.length) { grid.innerHTML = `<div class="empty">No garments match these filters.</div>`; document.getElementById("more").hidden = true; return; }
  let ordered_ = sorted(list), size = null, keyOf = null, last = null;
  if (groupBy) [ordered_, size, keyOf] = groupSorted(list, groupBy);
  grid.innerHTML = ordered_.slice(0, shown).map(it => {
    let head = "";
    if (groupBy) { const k = keyOf.get(it); if (k !== last) { head = groupHead(it, size.get(k)); last = k; } }
    return head + card(it);
  }).join("");
  document.getElementById("more").hidden = list.length <= shown;
}
function card(it) {
  {
    const sk = showFlat && it.sketch;
    const src = sk ? it.sketch : it.image;
    const tags = [it.color, it.pattern !== "solid" ? it.pattern : "", it.fit, it.fabric].filter(Boolean);
    const st = it.primary_style || "unclassified";
    return `<button class="card" data-id="${esc(it.id)}" aria-label="${esc(it.title)}, ${esc(label(st))}">
      <div class="img${sk ? " sk" : ""}"><img loading="lazy" class="${sk ? "flat" : ""}" src="${safeUrl(src)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">
        <span class="stag"><i style="background:${STYLE_COLOR[st]}"></i>${esc(label(st))}</span></div>
      <div class="meta"><div class="t">${esc(it.title)}</div>
        <div class="s">${esc(it.site)} · ${esc(money(it.price, cur(it)))}${it.discount_pct ? ` · ${it.discount_pct}% off` : ""} · ${esc(it.price_band || "")}</div>
        <div class="tags"><span class="tag">${esc(label(it.category))}</span>${tags.map(t => `<span class="tag">${esc(label(t))}</span>`).join("")}</div>
      </div></button>`;
  }
}

// ---------------------------------------------------------------- analytics
// Analytics = summary tables in %: colour, pattern, fit and fabric of the items the
// dropdown filters leave. No charts; every number is a share of the items in view.
const A_TABLES = [["color", "Colour"], ["pattern", "Pattern"], ["fit", "Fit"], ["fabric", "Fabric"]];

function pctTable(key, title, all) {
  // fit and fabric only exist for clothes: count only the items that have a value
  const known = key === "fit" || key === "fabric";
  const list = known ? all.filter(it => it[key] != null) : all;
  const total = list.length || 1;
  const counts = countBy(list, key);
  const rows = [...counts].sort((a, b) => b[1] - a[1]);
  const body = rows.map(([v, n]) => {
    const sw = key === "color" ? `<span class="dot" style="background:${SWATCH[v] || "transparent"}"></span>` : "";
    const on = sel[key].has(v);
    return `<tr class="${on ? "on" : ""}" data-k="${key}" data-v="${esc(v)}" title="Click to filter by ${esc(label(v))}">
      <td>${sw}${esc(label(v))}</td><td class="pc">${fmtPct(100 * n / total)}</td><td class="n">${n.toLocaleString()}</td></tr>`;
  }).join("");
  const base = known ? `% of the ${list.length.toLocaleString()} items with a ${title.toLowerCase()}`
    : `% of all ${list.length.toLocaleString()} items in view`;
  return `<div class="ptable"><h2>${esc(title)}</h2><p class="pnote">${esc(base)}</p>
    <table><thead><tr><th>${esc(title)}</th><th class="pc">% of items</th><th class="n">Items</th></tr></thead>
    <tbody>${body || `<tr><td colspan="3" class="empty">No data</td></tr>`}</tbody></table></div>`;
}

function renderAnalytics() {
  const list = items.filter(it => matches(it));
  const active = Object.entries(sel).filter(([, v]) => v.size).map(([k, v]) => `${FACETS[k][0]}: ${[...v].map(label).join(", ")}`);
  document.getElementById("kpis").innerHTML = `<div class="asum"><b>${list.length.toLocaleString()}</b> items in view
    · <b>${fmtPct(100 * list.length / (items.length || 1))}</b> of the ${catalogue === "women" ? "women's" : "men's"} catalogue
    ${active.length ? `· filtered by ${esc(active.join(" · "))}` : "· use the dropdowns above to filter"}</div>`;
  document.getElementById("charts").innerHTML = A_TABLES.map(([k, t]) => pctTable(k, t, list)).join("");
}

// ---------------------------------------------------------------- outfits (recommend.js)
let oseed = 0, lookSeed = 0;
function piece(it) {
  const sk = showFlat && it.sketch;
  return `<button class="opiece" data-oid="${esc(it.id)}" title="${esc(it.title)}">
    <div class="oi${sk ? "" : " ph"}"><img loading="lazy" src="${safeUrl(sk ? it.sketch : it.image)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'"></div>
    <span><b>${esc(label(it.category))}</b> · ${esc(label(it.color))}</span>
    <span>${esc(money(it.price, cur(it)))} · ${esc(it.site)}</span></button>`;
}
function outfitCard(o, title) {
  const total = o.items.reduce((a, i) => a + (i.price || 0), 0);
  return `<div class="ocard"><div class="ohead"><b>${esc(title)}</b><span>${esc(o.why || "")}</span>
    <span class="osc" title="Rules met (sections 3-7)">${o.score}/${o.max} rules · ${esc(money(total, "INR"))}</span></div>
    <div class="opieces">${o.items.map(piece).join("")}</div></div>`;
}
function fillStyleSelect() {
  const el = document.getElementById("o-style"), cur_ = el.value;
  el.innerHTML = `<option value="">Any</option>` + STYLES.filter(x => x !== "unclassified")
    .map(x => `<option value="${x}">${esc(label(x))}</option>`).join("");
  if (STYLES.includes(cur_)) el.value = cur_;
}
// No cap: every outfit the catalogue can make is found in the background, a few
// milliseconds at a time so the page stays responsive; the first 48 show at once
// and "Show more" reveals the rest.
const OPAGE = 48;
let ojob = 0, ores = [], oshown = 0, odone = false;
function oStatus() {
  const st = document.getElementById("ostatus"); if (!st) return;
  st.textContent = `${ores.length.toLocaleString()} outfits found` + (odone ? "" : " · still searching…") +
    (ores.length > oshown ? ` · showing ${oshown.toLocaleString()}` : "");
  const more = document.getElementById("o-showmore");
  if (more) more.hidden = oshown >= ores.length;
}
function oAppend(upto) {
  const list = document.getElementById("olist");
  if (!list || upto <= oshown) return oStatus();
  list.insertAdjacentHTML("beforeend", ores.slice(oshown, upto).map((o, i) => outfitCard(o, `Outfit ${oshown + i + 1}`)).join(""));
  oshown = upto;
  oStatus();
}
function renderOutfits() {
  const grid = document.getElementById("ogrid");
  if (!items.length) { grid.innerHTML = `<div class="empty">Loading…</div>`; return; }
  const v = id => document.getElementById(id).value;
  const f = {kind: v("o-kind"), style: v("o-style"), occasion: v("o-occasion"), band: v("o-band"), size: v("o-size")};
  const job = ++ojob;                       // a new choice stops the previous search
  ores = []; oshown = 0; odone = false;
  grid.innerHTML = `<p class="onote" id="ostatus" style="grid-column:1/-1;margin:0">Building outfits…</p>
    <div id="olist" style="display:contents"></div>
    <button id="o-showmore" class="obtn" hidden style="grid-column:1/-1;justify-self:center">Show ${OPAGE} more</button>`;
  const gen = Recommender.outfitStream(items, f, oseed);
  const step = () => {
    if (job !== ojob) return;
    const t = performance.now();
    while (performance.now() - t < 30) {
      const r = gen.next();
      if (r.done) { odone = true; break; }
      ores.push(r.value);
    }
    if (oshown < OPAGE) oAppend(Math.min(OPAGE, ores.length)); else oStatus();
    if (odone && !ores.length)
      grid.innerHTML = `<div class="empty">No outfit passes every rule for this choice (for example an Indian outfit in streetwear, or gym wear for a wedding). Try another style, occasion, budget or size.</div>`;
    if (!odone) setTimeout(step, 0);
  };
  setTimeout(step, 10);
}
function renderLook(it) {
  const box = document.getElementById("look");
  if (!box) return;
  const res = Recommender.completeLook(it, items, {n: 3, seed: lookSeed});
  box.innerHTML = `<h3>Complete the look <button class="obtn" id="look-more">Other looks ↻</button></h3>` +
    (res.length ? res.map((o, i) => outfitCard(o, `Look ${i + 1}`)).join("")
      : `<div class="s">No outfit in this catalogue passes every styling rule with this piece.</div>`);
}

// ---------------------------------------------------------------- drawer
function openDrawer(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  const src = it.attr_source || {};
  const badge = p => { const s = src[p]; return s ? `<span class="src ${s === "field" || s === "tags" ? "site" : ""}">${esc(SRC_TEXT[s] || s)}</span>` : ""; };
  const comp = it.composition ? Object.entries(it.composition).map(([k, v]) => `${v}% ${k}`).join(", ") : (it.fabrics || []).join(", ");
  const sc = it.style_scores ? Object.entries(it.style_scores).filter(([, v]) => v).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<span>${esc(label(k))} ${v}</span>`).join("") : "";
  const rows = [
    ["Style", `<span class="sdot" style="background:${STYLE_COLOR[it.primary_style || "unclassified"]}"></span> <b>${esc(label(it.primary_style))}</b>` +
      ((it.style_tags || []).length > 1 ? ` <span class="s">also ${esc(it.style_tags.slice(1).map(label).join(", "))}</span>` : "") +
      ` <span class="src">${esc(it.style_confidence || "")} confidence</span>` + (sc ? `<div class="scores">${sc}</div>` : "")],
    ["Wear type", esc((it.wear_types || []).map(label).join(", ") || "–")],
    ["Category", esc(label(it.category)) + ` <span class="src">${esc(it.department || "")}</span>`],
    ["Gender", esc(label(it.gender)) + badge("gender")],
    ["Price", `${esc(money(it.price, cur(it)))}${it.mrp && it.mrp > it.price ? ` <s>${esc(money(it.mrp, cur(it)))}</s> (${it.discount_pct}% off)` : ""} · ${esc(it.price_band || "")}`],
    ["Colour", esc(label(it.color)) + (it.color_name ? ` <span class="s">(site: ${esc(it.color_name)})</span>` : "") + badge("color")],
    ["Secondary colour", esc(label(it.secondary_color)) + badge("secondary_color")],
    ["Pattern", esc(label(it.pattern)) + badge("pattern")],
    ["Fit", esc(label(it.fit)) + badge("fit")],
    ["Fabric", esc(comp || "unspecified") + (it.gsm ? ` · ${it.gsm} GSM` : "") + badge("fabric")],
    ["Sleeve length", esc(label(it.sleeve_length)) + badge("sleeve_length")],
    ["Neckline", esc(label(it.neckline)) + badge("neckline")],
    ["Occasion", esc(label(it.occasion)) + badge("occasion") +
      ((it.occasions || []).length > 1 ? ` <span class="s">(site lists: ${esc(it.occasions.map(label).join(", "))})</span>` : "")],
    ["Sizes", esc((it.sizes || []).map(s => (it.sizes_available || []).includes(s) ? s : s + " (sold out)").join(", ") || "–") + badge("size")],
  ];
  const views = (it.flat_images || []).map((f, i) => `<figure><img src="${safeUrl(f)}" alt="Flat view ${i + 1}"><figcaption>view ${i + 1}</figcaption></figure>`).join("");
  const photos = (it.images || []).slice(0, 8).map((f, i) => `<figure><img src="${safeUrl(f)}" alt="Site photo ${i + 1}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'"><figcaption>photo ${i + 1}</figcaption></figure>`).join("");
  document.getElementById("drawer-root").innerHTML = `<div class="scrim" data-close></div>
    <div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(it.title)}">
      <button class="close" data-close aria-label="Close">×</button>
      <h2>${esc(it.title)}</h2><div class="s">${esc(it.site)}${it.vendor ? ` · ${esc(it.vendor)}` : ""} · <a class="ext" href="${safeUrl(it.url)}" target="_blank" rel="noopener">open on site ↗</a></div>
      ${it.sketch ? `<div class="sketchbox"><img src="${safeUrl(it.sketch)}" alt="Flat sketch, front and back"><div class="cap">${it.department === "footwear" ? "<span>SIDE</span><span>TOP</span>" : "<span>FRONT</span><span>BACK</span>"}</div></div>` : ""}
      ${views ? `<h3 style="font-size:13px;margin:16px 0 0">Photo cut-outs</h3><div class="views">${views}</div>` : ""}
      <table class="attrs">${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")}</table>
      ${Recommender.templateOf(it) && Recommender.templateOf(it) !== "accessory" ? `<div class="look" id="look" data-for="${esc(it.id)}"><h3>Complete the look</h3><div class="s">Finding outfits…</div></div>` : ""}
      <h3 style="font-size:13px;margin:16px 0 0">Site photos</h3><div class="views">${photos}</div>
    </div>`;
  document.querySelector(".drawer .close").focus();
  lookSeed = 0;
  setTimeout(() => renderLook(it), 10);
}
const closeDrawer = () => { document.getElementById("drawer-root").innerHTML = ""; };

// ---------------------------------------------------------------- render + events
function renderCatSwitch() {
  for (const b of document.querySelectorAll("#catsw button")) {
    const c = b.dataset.cat, n = DATA[c] ? DATA[c].length : null;
    b.setAttribute("aria-pressed", c === catalogue);
    b.innerHTML = `${c === "men" ? "Men" : "Women"}${n != null ? `<small>${n.toLocaleString()}</small>` : ""}`;
  }
  document.getElementById("title").textContent = CATALOGUES[catalogue].title;
  document.title = CATALOGUES[catalogue].title;
}
function loadCatalogue(c) {
  // switching catalogues starts from a clean slate: no filters or search carried over
  catalogue = c; STYLES = STYLES_BY[c];
  Object.values(sel).forEach(s => s.clear()); query = ""; shown = PAGE;
  document.getElementById("q").value = "";
  try { localStorage.setItem("catalogue", c); } catch {}
  if (location.hash !== "#" + c) history.replaceState(null, "", "#" + c);
  const done = d => { DATA[c] = d; if (catalogue !== c) return; items = d; renderCatSwitch(); render(); };
  if (DATA[c]) return done(DATA[c]);
  items = []; renderCatSwitch();
  document.getElementById("grid").innerHTML = `<div class="empty">Loading…</div>`;
  fetch(CATALOGUES[c].file).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(done)
    .catch(() => { if (catalogue !== c) return; items = []; render();
      document.getElementById("grid").innerHTML = `<div class="empty">${esc(CATALOGUES[c].file)} not found. Run <code>python -m pipeline.run build${c === "women" ? " --gender women" : ""}</code> first.</div>`; });
}
function render() {
  const list = items.filter(it => matches(it));
  document.getElementById("count").textContent = `${list.length.toLocaleString()} of ${items.length.toLocaleString()} items`;
  renderDropdowns(); renderActive();
  if (tab === "catalogue") { renderFilters(); renderGrid(list); }
  else if (tab === "outfits") { fillStyleSelect(); renderOutfits(); }
  else renderAnalytics();
}
function setTab(t) {
  tab = t;
  document.getElementById("tab-catalogue").setAttribute("aria-selected", t === "catalogue");
  document.getElementById("tab-analytics").setAttribute("aria-selected", t === "analytics");
  document.getElementById("tab-outfits").setAttribute("aria-selected", t === "outfits");
  document.getElementById("view-catalogue").classList.toggle("hidden", t !== "catalogue");
  document.getElementById("analytics").classList.toggle("hidden", t !== "analytics");
  document.getElementById("outfits").classList.toggle("hidden", t !== "outfits");
  try { localStorage.setItem("tab", t); } catch {}
  render();
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-close]")) return closeDrawer();
  const card = t.closest(".card"); if (card) return openDrawer(card.dataset.id);
  const op = t.closest("[data-oid]"); if (op) return openDrawer(op.dataset.oid);
  if (t.id === "o-more") { oseed++; return renderOutfits(); }
  if (t.id === "o-showmore") return oAppend(Math.min(ores.length, oshown + OPAGE));
  if (t.id === "look-more") { lookSeed++; const box = document.getElementById("look");
    const it = box && items.find(i => i.id === box.dataset.for); return it && renderLook(it); }
  const gh = t.closest("[data-group]");
  if (gh) { for (const [k, v] of JSON.parse(gh.dataset.group)) { sel[k].clear(); sel[k].add(String(v)); }
    shown = PAGE; return render(); }
  const cb = t.closest("[data-cat]"); if (cb) return cb.dataset.cat !== catalogue && loadCatalogue(cb.dataset.cat);
  const seg = t.closest("[data-seg]");
  if (seg) { const k = seg.dataset.seg, v = seg.dataset.v;
    return seg.closest(".seg") ? setOnly(k, v) : (v && toggle(k, v)); }
  const f = t.closest("[data-k]"); if (f) return toggle(f.dataset.k, f.dataset.v);
  if (t.id === "clear") { Object.values(sel).forEach(s => s.clear()); query = ""; document.getElementById("q").value = ""; shown = PAGE; return render(); }
  if (t.id === "more") { shown += PAGE; return renderGrid(items.filter(it => matches(it))); }
  if (t.id === "tab-catalogue" || t.id === "tab-analytics" || t.id === "tab-outfits") return setTab(t.id.slice(4));
  if (t.id === "theme") {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); shown = PAGE; render(); });
document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; shown = PAGE; render(); });
document.getElementById("groupby").addEventListener("change", e => {
  groupBy = e.target.value; shown = PAGE; try { localStorage.setItem("groupby", groupBy); } catch {} render(); });
try { const g = localStorage.getItem("groupby"); if (g !== null) { groupBy = g; document.getElementById("groupby").value = g; } } catch {}
document.getElementById("show-flat").addEventListener("change", e => { showFlat = e.target.checked; render(); });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("select[data-filter]")) { if (t.value !== "__many") setOnly(t.dataset.filter, t.value); return; }
});
for (const id of ["o-kind", "o-style", "o-occasion", "o-band", "o-size"])
  document.getElementById(id).addEventListener("change", () => { oseed = 0; renderOutfits(); });

const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el) { tip.classList.add("hidden"); return; }
  const [head, ...rest] = el.dataset.tip.split("|");
  tip.replaceChildren();
  const s = document.createElement("strong"); s.textContent = rest[0] || ""; tip.append(s, document.createElement("br"));
  tip.append(document.createTextNode(head));
  for (const r of rest.slice(1)) { tip.append(document.createElement("br"), document.createTextNode(r)); }
  tip.classList.remove("hidden");
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

try { const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
{
  let t = "catalogue", c = "men";
  try { t = localStorage.getItem("tab") || t; c = localStorage.getItem("catalogue") || c; } catch {}
  if (location.hash === "#women" || location.hash === "#men") c = location.hash.slice(1);
  const qt = new URLSearchParams(location.search).get("tab");   // e.g. ?tab=outfits
  if (["catalogue", "analytics", "outfits"].includes(qt)) t = qt;
  tab = t;
  document.getElementById("tab-catalogue").setAttribute("aria-selected", t === "catalogue");
  document.getElementById("tab-analytics").setAttribute("aria-selected", t === "analytics");
  document.getElementById("tab-outfits").setAttribute("aria-selected", t === "outfits");
  document.getElementById("view-catalogue").classList.toggle("hidden", t !== "catalogue");
  document.getElementById("analytics").classList.toggle("hidden", t !== "analytics");
  document.getElementById("outfits").classList.toggle("hidden", t !== "outfits");
  loadCatalogue(CATALOGUES[c] ? c : "men");
}
window.addEventListener("hashchange", () => { const c = location.hash.slice(1); if (CATALOGUES[c] && c !== catalogue) loadCatalogue(c); });
</script>
</body>
